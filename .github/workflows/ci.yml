name: ci

on:
  push:
    branches: [main]
  pull_request:

# Every gate below is defined ONCE, in packaging/verify.sh, and invoked here by name. The commands used to
# live in this file and nowhere else, which meant a developer's "green" was a strictly smaller claim than
# CI's: three eval suites locally, six gates here. A branch was pushed with all three suites green and CI
# failed on the one gate that had no local runner. Two copies of a rule drift, and the copy that drifts is
# the one nobody runs — so there is one copy, and `bash packaging/verify.sh` runs it.
#
# CSK_VERIFY_STRICT turns a skipped step into a failure. On a runner a missing tool is a broken runner, not
# an honest local limitation, and a gate that goes quiet on a broken runner reports success for a check
# nobody performed.
env:
  CSK_VERIFY_STRICT: "1"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Syntax — shell scripts
        run: bash packaging/verify.sh syntax

      - name: Smoke test — source (unpruned, 12 agents)
        run: bash packaging/verify.sh smoke

      - name: Routing eval — behavioral (golden routing + held-out + agent conflicts)
        run: bash packaging/verify.sh routing

      - name: README skill catalogue in sync with the skills
        run: bash packaging/verify.sh catalogue

      - name: Plugin & marketplace manifests valid (strict)
        # Offline manifest validation via the official CLI; --strict fails on unrecognized fields / missing
        # metadata. No API auth needed (this does not call the model). CI=true keeps it non-interactive.
        # The install is here rather than in verify.sh because verify.sh must never write to a machine.
        run: |
          npm install -g @anthropic-ai/claude-code
          bash packaging/verify.sh manifests

      - name: e2e rehearsal — start.sh (2 patterns + legacy flags) + adopt.sh (detection · overlap · refresh · migration)
        run: bash packaging/verify.sh e2e

  # Cross-platform proof: the installer and the non-interactive settings SELF-HEAL must behave the same on Windows
  # (Git-Bash) and macOS, not only Linux — Windows especially, since that is where the update was failing. Runs the
  # OS-sensitive checks (syntax · smoke · e2e); the Linux job above owns the manifest/catalogue checks.
  verify-cross:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Syntax — shell scripts
        run: bash packaging/verify.sh syntax

      - name: Smoke test
        run: bash packaging/verify.sh smoke

      - name: e2e rehearsal — installer + non-interactive self-heal (with/without jq·python)
        run: bash packaging/verify.sh e2e
