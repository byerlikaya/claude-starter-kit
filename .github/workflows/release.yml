name: release

# Cut a release by bumping VERSION + package.json, committing, then:
#   git tag vX.Y.Z && git push origin main --tags
# This workflow then: builds the tarball + GitHub release, publishes to npm,
# and bumps the Homebrew formula in byerlikaya/homebrew-tap — all automatically.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # create the GitHub release with GITHUB_TOKEN

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release   # publish waits for manual approval (see repo → Environments → release)
    steps:
      - uses: actions/checkout@v5

      - name: Resolve version (VERSION file must match the tag)
        id: v
        run: |
          FILE_VERSION="$(cat VERSION)"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$FILE_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::VERSION ($FILE_VERSION) != tag ($TAG_VERSION). Bump VERSION and package.json before tagging."
            exit 1
          fi
          echo "version=$FILE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify the plugin edition is in sync
        run: |
          bash packaging/build-plugin.sh
          # `git diff` compares tracked files and is blind to new ones. Measured: with a committed
          # plugin/agents and a freshly generated, untracked plugin/studio, `git diff --quiet -- plugin`
          # exits 0 — so a whole new subtree the build emits but nobody committed would ship as an
          # absent directory, with this gate green. `git status --porcelain` sees both.
          if [ -n "$(git status --porcelain -- plugin)" ]; then
            echo "::error::plugin/ is out of sync with claude-starter/. Run packaging/build-plugin.sh and commit."
            git --no-pager status --porcelain -- plugin
            git --no-pager diff --stat -- plugin
            exit 1
          fi

      - name: Verify the README skill catalogue is in sync
        run: bash packaging/build-readme-catalog.sh --check

      # The published site is the one artifact with no source here and no build step, so nothing but this
      # stops it shipping a stale version line — which is exactly what happened through all of 1.7.0.
      # Release-time only: mid-development the payload is legitimately ahead of what is published.
      - name: Verify the published site matches this release
        run: |
          git fetch --no-tags --depth=1 origin gh-pages:refs/remotes/origin/gh-pages
          bash packaging/check-gh-pages.sh

      # These gates run BEFORE anything is published, so a release cannot ship on top of a red smoke, routing or
      # e2e run. (This was the gate that was missing: release used to skip smoke/routing/e2e, so a green publish
      # could sit on a red CI.) They are not verify.sh's full set: syntax, manifests and studio run only in ci.yml.
      # And `environment: release` is job-level, so the approval is asked before any step of this job runs; once
      # approved, a run whose gates pass publishes with no further stop.
      - name: Verify — smoke test + routing eval
        run: |
          bash claude-starter/eval/smoke-test.sh
          bash claude-starter/eval/routing-eval.sh

      - name: Verify — installer e2e (start.sh combos + adopt.sh)
        run: bash packaging/e2e.sh

      - name: Build tarball
        run: bash make-release.sh

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.v.outputs.version }}"
          TGZ="dist/claude-starter-kit-${V}.tgz"
          {
            echo "## Install"
            echo
            echo "- **npx** — \`npx @byerlikaya/claude-starter-kit\` (fresh) · \`npx @byerlikaya/claude-starter-kit adopt\` (existing)"
            echo "- **Homebrew** — \`brew install byerlikaya/tap/claude-starter-kit\`"
            echo "- **Claude Code plugin** — \`/plugin marketplace add byerlikaya/claude-starter-kit\` -> \`/plugin install claude-starter-kit@byerlikaya\`"
            echo "- **Tarball** — download below, then \`bash start.sh\` (fresh) or \`bash adopt.sh\` (existing)"
            echo
            echo "## What's new"
            echo
            awk -v v="$V" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/{f=0} f' CHANGELOG.md
            echo
            echo "Full changelog: [CHANGELOG.md](https://github.com/byerlikaya/claude-starter-kit/blob/main/CHANGELOG.md)"
          } > release-notes.md
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file release-notes.md
            gh release upload "$GITHUB_REF_NAME" "$TGZ" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$TGZ" --title "$GITHUB_REF_NAME" --notes-file release-notes.md
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      # The repo README is rich (diagrams, collapsible sections, all install channels) — right for GitHub, noisy on
      # the npm page. Swap in the lean, npm-focused README for the published tarball ONLY (the commit is untouched).
      - name: Use the npm-flavoured README for the package
        run: |
          # The package must carry exactly one README. npm packs every root README.*, and with README.npm.md and
          # README.tr.md still beside README.md it chose README.tr.md for the npm page, which is what 2.10.0's page
          # showed. Its pick among several depends on directory order, so a single file is the only stable answer.
          if [ -f README.npm.md ]; then
            cp README.npm.md README.md
            rm -f README.npm.md README.tr.md
            echo "npm README staged for publish; README.npm.md and README.tr.md left out of the package"
          fi

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Bump Homebrew formula
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          V="${{ steps.v.outputs.version }}"
          SHA="$(sha256sum "dist/claude-starter-kit-${V}.tgz" | awk '{print $1}')"
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/byerlikaya/homebrew-tap.git" tap
          F="tap/Formula/claude-starter-kit.rb"
          # Publish THIS repo's formula, do not patch the tap's copy. The previous version rewrote only url,
          # sha256 and version, so the tap kept whatever install logic it was created with — and it kept
          # `update.sh` long after that script was renamed to adopt.sh. The tarball has never contained
          # update.sh (make-release.sh restricts it), so `brew install` could not work, and nothing noticed
          # because the formula in this repo was read by nobody. The repo is the source of truth now.
          cp packaging/homebrew/claude-starter-kit.rb "$F"
          sed -i -E "s#/releases/download/v[0-9.]+/claude-starter-kit-[0-9.]+\.tgz#/releases/download/v${V}/claude-starter-kit-${V}.tgz#" "$F"
          sed -i -E "s#sha256 \"[0-9a-f]{64}\"#sha256 \"${SHA}\"#" "$F"
          sed -i -E "s#version \"[0-9.]+\"#version \"${V}\"#" "$F"
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "claude-starter-kit ${V}"
          git push
